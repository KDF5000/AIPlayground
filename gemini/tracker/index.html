<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Activity Tracker</h1>
            <p class="subtitle">Consistency is key</p>
            <div class="header-actions">
                <button class="header-action-btn" id="export-btn" title="Export data as JSON">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Export
                </button>
                <button class="header-action-btn" id="import-btn" title="Import data from JSON">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Import
                </button>
                <input type="file" id="import-file-input" accept=".json" style="display:none">
            </div>
        </header>

        <main>

            <!-- Cat Check-in Interaction -->
            <div id="cat-wrapper" class="cat-wrapper">
                <div id="cat-character" class="cat-character">
                    <svg viewBox="0 0 100 100" width="80" height="80" class="cat-svg">
                        <g class="cat-group">
                            <!-- Paw (Base) -->
                            <path d="M20 80 Q 25 70 35 70 Q 45 70 50 80 L 20 80" fill="#cbd5e1" />

                            <!-- Head (Main) -->
                            <circle cx="50" cy="50" r="30" fill="#94a3b8" />

                            <!-- Ears -->
                            <path d="M25 35 L 20 15 L 45 25 Z" fill="#94a3b8" />
                            <path d="M75 35 L 80 15 L 55 25 Z" fill="#94a3b8" />

                            <!-- Inner Ears -->
                            <path d="M28 32 L 25 20 L 40 26 Z" fill="#fca5a5" />
                            <path d="M72 32 L 75 20 L 60 26 Z" fill="#fca5a5" />

                            <!-- Eyes -->
                            <ellipse cx="40" cy="45" rx="3" ry="4" fill="#0f172a" />
                            <ellipse cx="60" cy="45" rx="3" ry="4" fill="#0f172a" />

                            <!-- Nose -->
                            <path d="M48 52 L 52 52 L 50 55 Z" fill="#fca5a5" />

                            <!-- Mouth -->
                            <path d="M45 58 Q 50 60 55 58" fill="none" stroke="#0f172a" stroke-width="1.5"
                                stroke-linecap="round" />

                            <!-- Paw (Foreground Peeking) -->
                            <ellipse cx="30" cy="75" rx="8" ry="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
                        </g>
                    </svg>
                    <!-- "Meow" hint that appears on spawn/hover -->
                    <div class="cat-hint">Check in!</div>
                </div>
            </div>

            <!-- Main Content (Swiper / Carousel) -->
            <div id="swiper-wrapper">
                <div id="swiper-container">
                    <!-- Activity Cards will be injected here by JS -->
                    <!-- Example structure for reference:
                    <div class="activity-card">
                        <div class="stats-card">...</div>
                        <div class="heatmap-container">...</div>
                    </div>
                    -->
                </div>
                <!-- Pagination / Indicators (Optional) -->
                <div class="swiper-pagination"></div>
            </div>
        </main>
    </div>
    <!-- Delete Activity Modal -->
    <div class="modal-overlay" id="delete-activity-modal">
        <div class="modal-content">
            <h3 class="modal-title">Delete Activity?</h3>
            <p class="modal-body-text">Permanently delete <strong id="delete-activity-name"></strong> and all its check-in data? This cannot be undone.</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="delete-modal-cancel">Cancel</button>
                <button class="modal-btn modal-btn-danger" id="delete-modal-confirm">Delete</button>
            </div>
        </div>
    </div>

    <!-- Add Activity Modal -->
    <div class="modal-overlay" id="add-activity-modal">
        <div class="modal-content">
            <h3 class="modal-title">New Activity</h3>
            <input type="text" class="modal-input" id="activity-name-input" placeholder="e.g. Morning Run"
                maxlength="20">
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="modal-cancel">Cancel</button>
                <button class="modal-btn modal-btn-confirm" id="modal-confirm">Create</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
